<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ASCII_DOVE</title>
<meta name="description" content="Turn your camera and photos into glyph art.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/mobile.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0908'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23c9a227' font-family='serif'%3E%40%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="app">

  <header class="bar bar-top">
    <div class="mark"><span class="mark-glyph">▚</span><span class="mark-name">ASCII_DOVE</span></div>
    <div class="bar-spacer"></div>
    <button class="icon-btn" id="btnUndo" aria-label="Undo" disabled>↶</button>
    <button class="icon-btn" id="btnRoll" aria-label="Random look">⚄</button>
    <button class="icon-btn" id="btnMore" aria-label="More">⋯</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="plate"></canvas>
    <div class="stage-hint" id="stageHint">pinch to zoom · double-tap to fit</div>
  </main>

  <div class="strip" id="presetStrip" role="tablist" aria-label="Presets"></div>

  <nav class="bar bar-bottom">
    <button class="act" id="actCamera"><span class="act-ico">◉</span><span>Camera</span></button>
    <button class="act" id="actOpen"><span class="act-ico">▤</span><span>Photo</span></button>
    <button class="act" id="actLook"><span class="act-ico">§</span><span>Glyphs</span></button>
    <button class="act" id="actTone"><span class="act-ico">◐</span><span>Tone</span></button>
    <button class="act act-go" id="actSave"><span class="act-ico">⬓</span><span>Save</span></button>
  </nav>
</div>

<!-- ─────────── bottom sheets ─────────── -->
<div class="sheet-veil" id="sheetVeil" hidden></div>

<section class="sheet" id="sheetLook" hidden aria-label="Glyphs">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h2>Glyphs</h2><button class="sheet-x" data-close>✕</button></div>
  <div class="sheet-body">
    <label class="fld">Character set
      <select id="mSet" class="sel"></select>
    </label>
    <div id="rampPreview" class="ramp"></div>
    <div id="lookSliders"></div>
    <label class="tgl"><input type="checkbox" id="mReverse"><span class="tgl-box"></span>Reverse ramp</label>
  </div>
</section>

<section class="sheet" id="sheetTone" hidden aria-label="Tone">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h2>Tone</h2><button class="sheet-x" data-close>✕</button></div>
  <div class="sheet-body">
    <div id="toneSliders"></div>
    <label class="tgl"><input type="checkbox" id="mInvert"><span class="tgl-box"></span>Invert</label>
  </div>
</section>

<section class="sheet" id="sheetMore" hidden aria-label="More">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h2>Detail &amp; colour</h2><button class="sheet-x" data-close>✕</button></div>
  <div class="sheet-body">
    <div id="moreSliders"></div>
    <label class="fld">Colour
      <select id="mColorMode" class="sel">
        <option value="mono">Single colour</option>
        <option value="source">From photo</option>
        <option value="palette">Palette</option>
        <option value="gradient">Gradient</option>
      </select>
    </label>
    <label class="fld" id="palWrap">Palette
      <select id="mPalette" class="sel"></select>
    </label>
    <label class="fld" id="gradWrap" hidden>Gradient
      <select id="mGradient" class="sel"></select>
    </label>
    <label class="tgl"><input type="checkbox" id="mEdges"><span class="tgl-box"></span>Contour strokes
      <em class="tgl-note">sharper, ~2× slower</em>
    </label>
    <div class="sheet-foot">
      <span class="stat" id="mStats">—</span>
      <a class="link" href="index.html?desktop=1">Desktop version →</a>
    </div>
  </div>
</section>

<section class="sheet" id="sheetSave" hidden aria-label="Save">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h2>Save</h2><button class="sheet-x" data-close>✕</button></div>
  <div class="sheet-body">
    <button class="big" id="saveShare" hidden>Share image</button>
    <button class="big" id="savePng">Save PNG</button>
    <button class="big big-quiet" id="saveTxt">Save as text</button>
    <button class="big big-quiet" id="saveCopy">Copy text</button>
    <p class="note" id="saveNote">—</p>
  </div>
</section>

<div class="toast-stack" id="toasts" aria-live="polite"></div>
<input type="file" id="fileInput" accept="image/*,video/*" hidden>

<script src="js/charsets.js"></script>
<script src="js/palettes.js"></script>
<script src="js/imageproc.js"></script>
<script src="js/renderer.js"></script>
<script src="js/media.js"></script>
<script src="js/params.js"></script>
<script src="js/anim.js"></script>
<script src="js/lib/zip.js"></script>
<script src="js/lib/gifenc.js"></script>
<script src="js/exporters.js"></script>
<script src="js/presets.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
